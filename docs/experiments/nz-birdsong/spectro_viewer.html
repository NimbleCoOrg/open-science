<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectrogram Viewer</title>
<style>
  body { margin:0; background:#1a1a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:system-ui,sans-serif }
  img { max-width:90vw; max-height:80vh; image-rendering:pixelated; border:2px solid #444; border-radius:8px }
  #info { color:#ccc; font-size:14px; margin:12px 0; text-align:center }
  #info b { color:#fff }
</style>
</head>
<body>
  <div id="info"></div>
  <img id="spectro">
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    const title = params.get('title') || 'Spectrogram';
    document.getElementById('spectro').src = src;
    document.getElementById('info').innerHTML = `<b>${title}</b><br><span style="font-size:12px;color:#888">${src}</span>`;
    document.title = title;
  </script>
</body>
</html>
