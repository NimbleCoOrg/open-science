<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellbird Syllable Clustering — PCA Feature Space</title>
<style>
:root {
  --bg:#0f0f1a; --surface:#1a1a2e; --surface2:#252540; --border:#333355;
  --text:#e0ddd4; --text2:#9995aa; --accent:#6c8cff; --match:#4caf50; --reject:#ff5252;
  --mono:'Menlo','Monaco','Courier New',monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--mono); overflow:hidden; height:100vh; display:flex; flex-direction:column; }
header { padding:12px 20px; border-bottom:1px solid var(--border); background:var(--surface); }
header h1 { font-size:16px; color:var(--accent); font-weight:600; }
header .sub { font-size:11px; color:var(--text2); margin-top:2px; }
.main { display:flex; flex:1; overflow:hidden; }
.grid-area { flex:1; display:flex; flex-direction:column; padding:8px; gap:8px; min-width:0; }
.grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; flex:1; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:6px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
.panel-header { display:flex; gap:6px; padding:4px 8px; align-items:center; background:var(--surface2); border-bottom:1px solid var(--border); font-size:10px; }
.panel-header select { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:3px; font-size:10px; font-family:var(--mono); padding:1px 4px; }
.panel-header span { color:var(--text2); }
.canvas-wrap { flex:1; position:relative; }
.canvas-wrap canvas { position:absolute; top:0; left:0; width:100%; height:100%; cursor:crosshair; }
.sidebar { width:280px; min-width:280px; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px; font-size:11px; }
.sidebar h3 { font-size:12px; color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:4px; }
.legend-item { display:flex; align-items:center; gap:6px; cursor:pointer; padding:2px 0; user-select:none; }
.legend-item.hidden { opacity:0.3; }
.legend-swatch { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.legend-label { flex:1; }
.legend-count { color:var(--text2); }
.section { background:var(--surface2); border-radius:4px; padding:8px; }
.section p { margin:2px 0; }
.cluster-input { display:flex; gap:4px; margin-top:6px; }
.cluster-input input { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:3px; padding:3px 6px; font-family:var(--mono); font-size:11px; }
.cluster-input button, .btn { background:var(--accent); color:#fff; border:none; border-radius:3px; padding:4px 10px; font-family:var(--mono); font-size:11px; cursor:pointer; }
.cluster-input button:hover, .btn:hover { filter:brightness(1.2); }
.cluster-item { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--border); align-items:center; }
.cluster-item .cl-name { color:var(--match); }
.cluster-item .cl-remove { color:var(--reject); cursor:pointer; font-size:13px; }
.btn-row { display:flex; gap:6px; }
.btn.secondary { background:var(--surface2); border:1px solid var(--border); }
#status { color:var(--text2); font-size:10px; padding:4px 8px; }
.fisher-bar { display:flex; align-items:center; gap:4px; margin:1px 0; }
.fisher-bar-fill { height:8px; border-radius:2px; }
</style>
</head>
<body>
<header>
  <h1>Bellbird Syllable Clustering — PCA Feature Space</h1>
  <div class="sub" id="headerSub">Loading data...</div>
</header>
<div class="main">
  <div class="grid-area">
    <div class="grid" id="grid"></div>
    <div id="status">Scroll to zoom · Drag to pan · Shift+drag to lasso · Click point to inspect/play/exclude</div>
  </div>
  <div class="sidebar">
    <div>
      <h3>Color by</h3>
      <div style="display:flex;gap:4px;margin-bottom:6px">
        <button class="btn secondary" id="colorByFamily" onclick="setColorMode('family')" style="font-size:10px">Koe family</button>
        <button class="btn" id="colorByAssigned" onclick="setColorMode('assigned')" style="font-size:10px">Our categories</button>
        <button class="btn secondary" id="colorByConf" onclick="setColorMode('confidence')" style="font-size:10px">Confidence</button>
      </div>
    </div>
    <div>
      <h3>Review <span id="reviewCount" style="color:var(--reject);font-size:11px"></span></h3>
      <div style="display:flex;gap:4px;margin-bottom:4px">
        <button class="btn" onclick="reviewPrev()" style="font-size:10px">◀ Prev</button>
        <button class="btn" onclick="reviewNext()" style="font-size:10px">Next ▶</button>
        <span id="reviewProgress" style="font-size:10px;color:var(--text2);line-height:28px"></span>
      </div>
    </div>
    <div>
      <h3>Families</h3>
      <div id="legend"></div>
    </div>
    <div>
      <h3>Selection</h3>
      <div class="section" id="selInfo"><p style="color:var(--text2)">Shift+drag to lasso-select points</p></div>
    </div>
    <div id="pointDetail" style="display:none">
      <h3>Point Detail</h3>
      <div class="section" id="pointDetailContent"></div>
    </div>
    <div>
      <h3>Clusters</h3>
      <div class="cluster-input">
        <input type="text" id="clusterName" placeholder="Cluster name...">
        <button onclick="assignCluster()">Assign</button>
      </div>
      <div id="clusterList" style="margin-top:8px"></div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="exportClusters()">Export Clusters</button>
      <button class="btn secondary" onclick="clearSelection()">Clear Selection</button>
      <button class="btn secondary" onclick="unexcludeAll()" style="border-color:var(--reject)">Restore excluded</button>
    </div>
    <div><span id="excludeCount" style="font-size:10px;color:var(--reject)"></span></div>
  </div>
</div>

<script>
const FAMILY_COLORS = [
  '#ff6b6b','#4ecdc4','#ffe66d','#a29bfe','#fd79a8',
  '#00cec9','#fab1a0','#74b9ff','#55efc4','#fdcb6e'
];

let DATA = null;
let familyColorMap = {};
let hiddenFamilies = new Set();
let selectedIds = new Set();
let clusters = {}; // name -> Set of ids
let panels = [];

const DEFAULTS = [[0,1],[0,2],[1,2],[1,3]];

class Panel {
  constructor(container, idx) {
    this.idx = idx;
    this.pcX = DEFAULTS[idx][0];
    this.pcY = DEFAULTS[idx][1];
    this.zoom = 1;
    this.panX = 0;
    this.panY = 0;
    this.lasso = null;
    this.dragging = false;
    this.dragStart = null;
    this.lastMouse = null;

    const div = document.createElement('div');
    div.className = 'panel';
    const hdr = document.createElement('div');
    hdr.className = 'panel-header';
    this.selX = this._mkSel(this.pcX);
    this.selY = this._mkSel(this.pcY);
    hdr.innerHTML = '';
    hdr.appendChild(this.selX);
    hdr.appendChild(document.createTextNode(' vs '));
    hdr.appendChild(this.selY);
    const varSpan = document.createElement('span');
    varSpan.className = 'var-info';
    this.varSpan = varSpan;
    hdr.appendChild(varSpan);
    div.appendChild(hdr);

    const wrap = document.createElement('div');
    wrap.className = 'canvas-wrap';
    this.canvas = document.createElement('canvas');
    wrap.appendChild(this.canvas);
    div.appendChild(wrap);
    container.appendChild(div);

    this.ctx = this.canvas.getContext('2d');
    this.wrap = wrap;

    this.selX.onchange = () => { this.pcX = +this.selX.value; this.resetView(); requestRender(); };
    this.selY.onchange = () => { this.pcY = +this.selY.value; this.resetView(); requestRender(); };

    this.canvas.addEventListener('wheel', e => { e.preventDefault(); this._onWheel(e); }, {passive:false});
    this.canvas.addEventListener('mousedown', e => this._onDown(e));
    this.canvas.addEventListener('mousemove', e => this._onMove(e));
    this.canvas.addEventListener('mouseup', e => this._onUp(e));
    this.canvas.addEventListener('mouseleave', e => this._onUp(e));

    new ResizeObserver(() => this._resize()).observe(wrap);
  }

  _mkSel(val) {
    const s = document.createElement('select');
    for (let i = 0; i < 8; i++) {
      const o = document.createElement('option');
      o.value = i; o.textContent = 'PC'+(i+1);
      if (i === val) o.selected = true;
      s.appendChild(o);
    }
    return s;
  }

  _resize() {
    const r = this.wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.w = r.width; this.h = r.height;
    this.canvas.width = r.width * dpr;
    this.canvas.height = r.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    requestRender();
  }

  resetView() {
    if (!DATA) return;
    const pts = DATA.points;
    let mnx=Infinity, mxx=-Infinity, mny=Infinity, mxy=-Infinity;
    for (const p of pts) {
      const x = p.pc[this.pcX], y = p.pc[this.pcY];
      if (x<mnx) mnx=x; if (x>mxx) mxx=x;
      if (y<mny) mny=y; if (y>mxy) mxy=y;
    }
    const pad = 0.1;
    const dx = (mxx-mnx)*pad, dy = (mxy-mny)*pad;
    mnx-=dx; mxx+=dx; mny-=dy; mxy+=dy;
    this.dataMinX=mnx; this.dataMaxX=mxx; this.dataMinY=mny; this.dataMaxY=mxy;
    this.zoom=1; this.panX=0; this.panY=0;
  }

  dataToScreen(dx, dy) {
    const margin = 30;
    const w = this.w - margin*2, h = this.h - margin*2;
    const rangeX = (this.dataMaxX-this.dataMinX)/this.zoom;
    const rangeY = (this.dataMaxY-this.dataMinY)/this.zoom;
    const cx = (this.dataMinX+this.dataMaxX)/2 + this.panX;
    const cy = (this.dataMinY+this.dataMaxY)/2 + this.panY;
    const sx = margin + (dx - (cx - rangeX/2)) / rangeX * w;
    const sy = margin + ((cy + rangeY/2) - dy) / rangeY * h;
    return [sx, sy];
  }

  screenToData(sx, sy) {
    const margin = 30;
    const w = this.w - margin*2, h = this.h - margin*2;
    const rangeX = (this.dataMaxX-this.dataMinX)/this.zoom;
    const rangeY = (this.dataMaxY-this.dataMinY)/this.zoom;
    const cx = (this.dataMinX+this.dataMaxX)/2 + this.panX;
    const cy = (this.dataMinY+this.dataMaxY)/2 + this.panY;
    const dx = (sx - margin) / w * rangeX + (cx - rangeX/2);
    const dy = (cy + rangeY/2) - (sy - margin) / h * rangeY;
    return [dx, dy];
  }

  _onWheel(e) {
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    this.zoom *= factor;
    if (this.zoom < 0.1) this.zoom = 0.1;
    if (this.zoom > 50) this.zoom = 50;
    requestRender();
  }

  _getPos(e) {
    const r = this.canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  _onDown(e) {
    const pos = this._getPos(e);
    if (e.shiftKey) {
      this.lasso = [pos];
      this.dragging = false;
    } else {
      this.dragging = true;
      this.dragStart = pos;
      this.lastMouse = pos;
      this._clickPos = pos;
    }
  }

  _onMove(e) {
    const pos = this._getPos(e);
    if (this.lasso) {
      this.lasso.push(pos);
      requestRender();
    } else if (this.dragging) {
      const dx = pos[0] - this.lastMouse[0];
      const dy = pos[1] - this.lastMouse[1];
      const rangeX = (this.dataMaxX-this.dataMinX)/this.zoom;
      const rangeY = (this.dataMaxY-this.dataMinY)/this.zoom;
      const margin = 30;
      this.panX -= dx / (this.w - margin*2) * rangeX;
      this.panY += dy / (this.h - margin*2) * rangeY;
      this.lastMouse = pos;
      requestRender();
    }
  }

  _onUp(e) {
    if (this.lasso && this.lasso.length > 2) {
      this._finishLasso();
    } else if (this.dragging && this._clickPos) {
      // Check if it was a click (not a drag)
      const pos = this._getPos(e);
      const dx = pos[0] - this._clickPos[0], dy = pos[1] - this._clickPos[1];
      if (Math.sqrt(dx*dx + dy*dy) < 5) {
        this._handleClick(pos);
      }
    }
    this.lasso = null;
    this.dragging = false;
    this.dragStart = null;
    this._clickPos = null;
    requestRender();
  }

  _handleClick(pos) {
    // Find nearest point within 10px
    let bestDist = 10, bestPt = null;
    for (const p of DATA.points) {
      if (hiddenFamilies.has(p.family) || excludedIds.has(p.id)) continue;
      const [sx, sy] = this.dataToScreen(p.pc[this.pcX], p.pc[this.pcY]);
      const d = Math.sqrt((sx-pos[0])**2 + (sy-pos[1])**2);
      if (d < bestDist) { bestDist = d; bestPt = p; }
    }
    if (bestPt) {
      hoveredPoint = bestPt;
      showPointDetail(bestPt);
      requestRender();
    }
  }

  _finishLasso() {
    const newSel = new Set();
    for (const p of DATA.points) {
      if (hiddenFamilies.has(p.family)) continue;
      const [sx, sy] = this.dataToScreen(p.pc[this.pcX], p.pc[this.pcY]);
      if (pointInPolygon(sx, sy, this.lasso)) {
        newSel.add(p.id);
      }
    }
    selectedIds = newSel;
    updateSelectionInfo();
    requestRender();
  }

  draw() {
    const ctx = this.ctx;
    const w = this.w, h = this.h;
    ctx.clearRect(0, 0, w, h);
    if (!DATA) return;

    // Update variance info
    if (DATA.explained_variance) {
      const vx = (DATA.explained_variance[this.pcX]*100).toFixed(1);
      const vy = (DATA.explained_variance[this.pcY]*100).toFixed(1);
      this.varSpan.textContent = ` (${vx}%+${vy}%)`;
    }

    // Draw axes
    const margin = 30;
    ctx.strokeStyle = '#333355';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(margin, margin); ctx.lineTo(margin, h-margin);
    ctx.lineTo(w-margin, h-margin);
    ctx.stroke();

    // Axis labels
    ctx.fillStyle = '#9995aa';
    ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.fillText('PC'+(this.pcX+1), w/2, h-4);
    ctx.save();
    ctx.translate(10, h/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('PC'+(this.pcY+1), 0, 0);
    ctx.restore();

    // Draw unselected points first, then selected on top
    const pts = DATA.points;
    // Batch by color for performance
    const buckets = {};
    const selBuckets = {};
    const exclPts = [];
    for (const p of pts) {
      if (hiddenFamilies.has(p.family)) continue;
      const [sx, sy] = this.dataToScreen(p.pc[this.pcX], p.pc[this.pcY]);
      if (sx < margin-5 || sx > w-margin+5 || sy < margin-5 || sy > h-margin+5) continue;
      if (excludedIds.has(p.id)) {
        exclPts.push([sx, sy]);
        continue;
      }
      const col = getPointColor(p);
      if (selectedIds.has(p.id)) {
        if (!selBuckets[col]) selBuckets[col] = [];
        selBuckets[col].push([sx, sy]);
      } else {
        if (!buckets[col]) buckets[col] = [];
        buckets[col].push([sx, sy]);
      }
    }

    // Draw unselected
    for (const col in buckets) {
      ctx.fillStyle = col + '88';
      ctx.beginPath();
      for (const [sx, sy] of buckets[col]) {
        ctx.moveTo(sx+2.5, sy);
        ctx.arc(sx, sy, 2.5, 0, Math.PI*2);
      }
      ctx.fill();
    }

    // Draw selected
    for (const col in selBuckets) {
      // Glow
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      for (const [sx, sy] of selBuckets[col]) {
        ctx.moveTo(sx+5, sy);
        ctx.arc(sx, sy, 5, 0, Math.PI*2);
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Draw cluster-assigned points with ring
    for (const [cname, cids] of Object.entries(clusters)) {
      for (const id of cids) {
        const p = DATA.pointMap[id];
        if (!p || hiddenFamilies.has(p.family)) continue;
        const [sx, sy] = this.dataToScreen(p.pc[this.pcX], p.pc[this.pcY]);
        if (sx < margin-5 || sx > w-margin+5 || sy < margin-5 || sy > h-margin+5) continue;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(sx, sy, 4, 0, Math.PI*2);
        ctx.stroke();
      }
    }

    // Draw lasso
    if (this.lasso && this.lasso.length > 1) {
      ctx.strokeStyle = '#6c8cff';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(this.lasso[0][0], this.lasso[0][1]);
      for (let i = 1; i < this.lasso.length; i++) {
        ctx.lineTo(this.lasso[i][0], this.lasso[i][1]);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(108,140,255,0.08)';
      ctx.fill();
    }

    // Draw excluded points as dim X marks
    if (exclPts.length > 0) {
      ctx.strokeStyle = '#ff525244';
      ctx.lineWidth = 1;
      for (const [sx, sy] of exclPts) {
        ctx.beginPath();
        ctx.moveTo(sx-3, sy-3); ctx.lineTo(sx+3, sy+3);
        ctx.moveTo(sx+3, sy-3); ctx.lineTo(sx-3, sy+3);
        ctx.stroke();
      }
    }

    // Highlight hovered/clicked point
    if (hoveredPoint && !hiddenFamilies.has(hoveredPoint.family) && !excludedIds.has(hoveredPoint.id)) {
      const [sx, sy] = this.dataToScreen(hoveredPoint.pc[this.pcX], hoveredPoint.pc[this.pcY]);
      if (sx >= margin-5 && sx <= w-margin+5 && sy >= margin-5 && sy <= h-margin+5) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx, sy, 8, 0, Math.PI*2);
        ctx.stroke();
        ctx.strokeStyle = '#6c8cff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(sx, sy, 10, 0, Math.PI*2);
        ctx.stroke();
      }
    }
  }
}

function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

let renderPending = false;
let excludedIds = new Set();
let hoveredPoint = null;
let activeAudio = null;
let colorMode = 'assigned'; // 'family', 'assigned', 'confidence'
let reviewPoints = [];
let reviewIndex = -1;

const ASSIGNED_COLORS = {
  'Pipe':'#a29bfe', 'Stutter':'#55efc4', 'Flatspeak':'#fd79a8', 'Stepup':'#74b9ff',
  'Down':'#fab1a0', 'Alarmy':'#00cec9', 'Peaksqueak':'#fdcb6e', 'Cough + Click':'#e17055',
  'Chortle':'#81ecec', 'Cough':'#ff6b6b'
};
const CONF_COLORS = {
  'ground_truth':'#4caf50', 'high':'#6c8cff', 'medium':'#e8a735', 'low':'#ff5252', 'none':'#555'
};

function getPointColor(p) {
  if (colorMode === 'assigned' && p.assigned_category) {
    return ASSIGNED_COLORS[p.assigned_category] || '#888';
  } else if (colorMode === 'confidence') {
    return CONF_COLORS[p.assignment_confidence] || '#555';
  }
  return familyColorMap[p.family] || '#888';
}

function setColorMode(mode) {
  colorMode = mode;
  document.getElementById('colorByFamily').className = mode==='family' ? 'btn' : 'btn secondary';
  document.getElementById('colorByAssigned').className = mode==='assigned' ? 'btn' : 'btn secondary';
  document.getElementById('colorByConf').className = mode==='confidence' ? 'btn' : 'btn secondary';
  buildLegend();
  requestRender();
}

function initReview() {
  if (!DATA) return;
  reviewPoints = DATA.points.filter(p => p.assignment_confidence === 'low').map(p => p.id);
  document.getElementById('reviewCount').textContent = `(${reviewPoints.length} ambiguous)`;
}

function reviewNext() {
  if (reviewPoints.length === 0) return;
  reviewIndex = (reviewIndex + 1) % reviewPoints.length;
  const pid = reviewPoints[reviewIndex];
  const p = DATA.pointMap[pid];
  if (p) { hoveredPoint = p; showPointDetail(p); }
  document.getElementById('reviewProgress').textContent = `${reviewIndex+1}/${reviewPoints.length}`;
  requestRender();
}

function reviewPrev() {
  if (reviewPoints.length === 0) return;
  reviewIndex = (reviewIndex - 1 + reviewPoints.length) % reviewPoints.length;
  const pid = reviewPoints[reviewIndex];
  const p = DATA.pointMap[pid];
  if (p) { hoveredPoint = p; showPointDetail(p); }
  document.getElementById('reviewProgress').textContent = `${reviewIndex+1}/${reviewPoints.length}`;
  requestRender();
}

function requestRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    renderPending = false;
    for (const p of panels) p.draw();
  });
}

function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  
  let items;
  if (colorMode === 'assigned') {
    // Group by assigned category
    const catCounts = {};
    for (const p of DATA.points) {
      const cat = p.assigned_category || 'unassigned';
      catCounts[cat] = (catCounts[cat] || 0) + 1;
    }
    items = Object.entries(catCounts).sort((a,b) => b[1]-a[1]);
    for (const [cat, cnt] of items) {
      const col = ASSIGNED_COLORS[cat] || '#888';
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-swatch" style="background:${col}"></div><span class="legend-label">${cat}</span><span class="legend-count">${cnt}</span>`;
      el.appendChild(item);
    }
  } else if (colorMode === 'confidence') {
    const confOrder = ['ground_truth', 'high', 'medium', 'low'];
    const confLabels = {'ground_truth':'Manual (Azure)', 'high':'High confidence', 'medium':'Medium', 'low':'Low (review)'};
    for (const conf of confOrder) {
      const cnt = DATA.points.filter(p => p.assignment_confidence === conf).length;
      if (cnt === 0) continue;
      const col = CONF_COLORS[conf];
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-swatch" style="background:${col}"></div><span class="legend-label">${confLabels[conf]}</span><span class="legend-count">${cnt}</span>`;
      el.appendChild(item);
    }
  } else {
    // Original family colors
    for (let i = 0; i < DATA.families.length; i++) {
      const fam = DATA.families[i];
      const col = familyColorMap[fam];
      const cnt = DATA.family_counts[fam] || 0;
      const item = document.createElement('div');
      item.className = 'legend-item' + (hiddenFamilies.has(fam) ? ' hidden' : '');
      item.innerHTML = `<div class="legend-swatch" style="background:${col}"></div><span class="legend-label">${fam}</span><span class="legend-count">${cnt}</span>`;
      item.onclick = () => {
        if (hiddenFamilies.has(fam)) hiddenFamilies.delete(fam);
        else hiddenFamilies.add(fam);
        item.className = 'legend-item' + (hiddenFamilies.has(fam) ? ' hidden' : '');
        requestRender();
      };
      el.appendChild(item);
    }
  }
}

function updateSelectionInfo() {
  const el = document.getElementById('selInfo');
  if (selectedIds.size === 0) {
    el.innerHTML = '<p style="color:var(--text2)">Shift+drag to lasso-select points</p>';
    return;
  }
  const selPts = DATA.points.filter(p => selectedIds.has(p.id));
  const famBreak = {};
  let fisherMin=Infinity, fisherMax=-Infinity, fisherSum=0;
  const fisherBins = [0,0,0,0,0]; // 0-1, 1-2, 2-3, 3-4, 4+
  for (const p of selPts) {
    famBreak[p.family] = (famBreak[p.family]||0) + 1;
    const f = p.fisher_score;
    if (f<fisherMin) fisherMin=f;
    if (f>fisherMax) fisherMax=f;
    fisherSum += f;
    if (f<1) fisherBins[0]++;
    else if (f<2) fisherBins[1]++;
    else if (f<3) fisherBins[2]++;
    else if (f<4) fisherBins[3]++;
    else fisherBins[4]++;
  }
  const fisherLabels = ['0-1','1-2','2-3','3-4','4+'];
  const maxBin = Math.max(...fisherBins, 1);

  let html = `<p><b>${selectedIds.size}</b> points selected</p>`;
  html += `<p style="margin-top:6px;color:var(--text2)">Family breakdown:</p>`;
  for (const [fam, cnt] of Object.entries(famBreak).sort((a,b)=>b[1]-a[1])) {
    const col = familyColorMap[fam];
    html += `<p><span style="color:${col}">■</span> ${fam}: ${cnt}</p>`;
  }
  html += `<p style="margin-top:6px;color:var(--text2)">Fisher score: ${fisherMin.toFixed(2)} – ${fisherMax.toFixed(2)} (μ=${(fisherSum/selPts.length).toFixed(2)})</p>`;
  for (let i = 0; i < 5; i++) {
    const pct = (fisherBins[i]/maxBin*100);
    html += `<div class="fisher-bar"><span style="width:24px;text-align:right;color:var(--text2)">${fisherLabels[i]}</span><div class="fisher-bar-fill" style="width:${pct}%;background:var(--accent);min-width:${fisherBins[i]?2:0}px"></div><span style="color:var(--text2)">${fisherBins[i]}</span></div>`;
  }
  el.innerHTML = html;
}

function showPointDetail(p) {
  const panel = document.getElementById('pointDetail');
  const el = document.getElementById('pointDetailContent');
  panel.style.display = 'block';
  
  const col = familyColorMap[p.family] || '#888';
  const wavBase = p.wav ? p.wav.replace('.wav','') : '';
  
  // Build spectrogram URL if available (from annotation candidates)
  let spectroHtml = '';
  // Try to find matching spectrogram in annotation/bellbird/ directory
  const spectroUrl = `annotation/bellbird/${p.id}.png`;
  spectroHtml = `<img src="${spectroUrl}" style="width:100%;border-radius:4px;border:1px solid var(--border);margin:4px 0;cursor:pointer" 
    onerror="this.style.display='none'" onclick="window.open('${spectroUrl}','_blank')">`;
  
  // Audio URL
  const audioUrl = p.wav ? `annotation/bellbird/${p.id}.wav` : '';
  
  let html = `
    <p><span style="color:${col}">■</span> <b>${p.family}</b> · ID: ${p.id}</p>
    ${p.assigned_category ? `<p style="margin-top:2px">→ <b style="color:${ASSIGNED_COLORS[p.assigned_category]||'#fff'}">${p.assigned_category}</b> <span style="font-size:9px;color:var(--text2)">(${p.assignment_source}, ${p.assignment_confidence}${p.assignment_score ? ', score='+p.assignment_score.toFixed(3) : ''})</span></p>` : ''}
    <p style="color:var(--text2)">${p.wav || 'unknown'}</p>
    <p style="color:var(--text2)">${p.start_ms}–${p.end_ms}ms (${p.duration_ms}ms)</p>
    ${spectroHtml}
    <p style="margin-top:4px;color:var(--text2)">Fisher: ${p.fisher_score?.toFixed(2) || '?'} · Nearest: ${p.nearest_other || '?'}</p>
    <p style="color:var(--text2)">Centroid: ${p.spectral?.centroid?.toFixed(0) || '?'}Hz · BW: ${p.spectral?.bandwidth?.toFixed(0) || '?'}Hz</p>
    <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">
      ${audioUrl ? `<button class="btn" onclick="playPoint('${audioUrl}')" style="background:var(--accent)">▶ Play</button>` : ''}
      <button class="btn" onclick="excludePoint(${p.id})" style="background:var(--reject)">✗ Exclude</button>
      <button class="btn secondary" onclick="hidePointDetail()">Close</button>
    </div>`;
  el.innerHTML = html;
}

function hidePointDetail() {
  document.getElementById('pointDetail').style.display = 'none';
  hoveredPoint = null;
  requestRender();
}

function playPoint(url) {
  if (activeAudio) { activeAudio.pause(); activeAudio = null; }
  activeAudio = new Audio(url);
  activeAudio.play().catch(e => console.warn('Audio play failed:', e));
}

function excludePoint(id) {
  excludedIds.add(id);
  // Remove from any clusters
  for (const [name, ids] of Object.entries(clusters)) {
    ids.delete(id);
  }
  // Remove from selection
  selectedIds.delete(id);
  hidePointDetail();
  updateSelectionInfo();
  updateClusterList();
  updateExcludeCount();
  requestRender();
}

function unexcludeAll() {
  excludedIds.clear();
  updateExcludeCount();
  requestRender();
}

function updateExcludeCount() {
  const el = document.getElementById('excludeCount');
  if (el) el.textContent = excludedIds.size > 0 ? `${excludedIds.size} excluded` : '';
}

function assignCluster() {
  const name = document.getElementById('clusterName').value.trim();
  if (!name) return;
  if (selectedIds.size === 0) return;
  if (!clusters[name]) clusters[name] = new Set();
  for (const id of selectedIds) clusters[name].add(id);
  document.getElementById('clusterName').value = '';
  updateClusterList();
  requestRender();
}

function updateClusterList() {
  const el = document.getElementById('clusterList');
  let html = '';
  for (const [name, ids] of Object.entries(clusters)) {
    html += `<div class="cluster-item"><span class="cl-name">${name}</span><span>${ids.size} pts</span><span class="cl-remove" onclick="deleteCluster('${name}')">&times;</span></div>`;
  }
  if (!html) html = '<p style="color:var(--text2)">No clusters defined</p>';
  el.innerHTML = html;
}

function deleteCluster(name) {
  delete clusters[name];
  updateClusterList();
  requestRender();
}

function clearSelection() {
  selectedIds.clear();
  updateSelectionInfo();
  requestRender();
}

function exportClusters() {
  const out = {};
  for (const [name, ids] of Object.entries(clusters)) {
    out[name] = [...ids];
  }
  const exportData = {
    clusters: out,
    excluded: [...excludedIds],
    exported_at: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bellbird_clusters.json';
  a.click();
}

async function init() {
  try {
    const resp = await fetch('annotation/bellbird_pca_data.json');
    DATA = await resp.json();
  } catch(e) {
    document.getElementById('headerSub').textContent = 'Error loading data: ' + e.message;
    return;
  }

  // Build point lookup
  DATA.pointMap = {};
  for (const p of DATA.points) DATA.pointMap[p.id] = p;

  // Assign colors
  for (let i = 0; i < DATA.families.length; i++) {
    familyColorMap[DATA.families[i]] = FAMILY_COLORS[i % FAMILY_COLORS.length];
  }

  // Header
  const totalVar = DATA.explained_variance.reduce((a,b)=>a+b,0);
  document.getElementById('headerSub').textContent =
    `${DATA.n_points} syllable segments · ${DATA.families.length} families · ${DATA.n_components} PCs (${(totalVar*100).toFixed(1)}% variance explained)`;

  // Build panels
  const grid = document.getElementById('grid');
  for (let i = 0; i < 4; i++) {
    const p = new Panel(grid, i);
    panels.push(p);
  }

  // Init views after first layout
  requestAnimationFrame(() => {
    for (const p of panels) {
      p._resize();
      p.resetView();
    }
    buildLegend();
    updateClusterList();
    initReview();
    requestRender();
  });
}

init();
</script>
